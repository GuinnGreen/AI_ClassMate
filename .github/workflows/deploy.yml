name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [guide-updated]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    outputs:
      guide_sha: ${{ steps.resolve_guide.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Require pinned guide revision
        id: guide_ref
        env:
          GUIDE_REF: ${{ vars.GUIDE_REF }}
        run: |
          if [[ ! "$GUIDE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GUIDE_REF must be a reviewed 40-character lowercase commit SHA." >&2
            exit 1
          fi
          echo "sha=$GUIDE_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned guide site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: GuinnGreen/AI_ClassMate_guide
          ref: ${{ steps.guide_ref.outputs.sha }}
          path: _guide_repo
          persist-credentials: false

      - name: Resolve verified Guide revision
        id: resolve_guide
        env:
          REQUESTED_GUIDE_SHA: ${{ steps.guide_ref.outputs.sha }}
        run: |
          GUIDE_SHA=$(git -C _guide_repo rev-parse HEAD)
          if [[ "$GUIDE_SHA" != "$REQUESTED_GUIDE_SHA" ]]; then
            echo "Checked-out Guide revision does not match the validated GUIDE_REF." >&2
            exit 1
          fi
          echo "sha=$GUIDE_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install main app dependencies
        run: npm ci

      - name: Verify main app
        run: npm run verify

      - name: Verify Firestore Rules
        run: npm run test:rules

      - name: Install and verify Functions
        run: npm ci --prefix functions && npm --prefix functions run verify

      - name: Install and verify Guide
        working-directory: _guide_repo/guide
        run: npm ci && npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

  build:
    needs: verify
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout pinned guide site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: GuinnGreen/AI_ClassMate_guide
          ref: ${{ needs.verify.outputs.guide_sha }}
          path: _guide_repo
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install main app dependencies
        run: npm ci

      - name: Write release manifest
        env:
          EXPECTED_GUIDE_COMMIT: ${{ needs.verify.outputs.guide_sha }}
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GUIDE_COMMIT=$(git -C _guide_repo rev-parse HEAD)
          if [[ "$GUIDE_COMMIT" != "$EXPECTED_GUIDE_COMMIT" ]]; then
            echo "Build Guide revision does not match the verified Guide revision." >&2
            exit 1
          fi
          RULES_HASH=$(sha256sum firestore.rules | cut -d' ' -f1)
          APP_COMMIT="$GITHUB_SHA" GUIDE_COMMIT="$GUIDE_COMMIT" RULES_HASH="$RULES_HASH" BUILD_TIME="$BUILD_TIME" npm run release:manifest
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"

      - name: Build main app
        run: npm run build
        env:
          VITE_APP_BUILD_TIME: ${{ env.BUILD_TIME }}
          VITE_APP_ENV: production
          VITE_USE_FIREBASE_EMULATORS: 'false'
          VITE_ALLOW_REMOTE_FIREBASE: 'true'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Install guide dependencies
        working-directory: _guide_repo/guide
        run: npm ci

      - name: Build guide
        working-directory: _guide_repo/guide
        run: npm run build

      - name: Merge build outputs
        run: |
          mkdir -p dist/guide
          cp -r _guide_repo/guide/dist/* dist/guide/

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: './dist'

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
