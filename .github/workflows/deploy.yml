name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [guide-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main app
        uses: actions/checkout@v4

      - name: Require pinned guide revision
        env:
          GUIDE_REF: ${{ vars.GUIDE_REF }}
        run: |
          if [[ ! "$GUIDE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GUIDE_REF must be a reviewed 40-character lowercase commit SHA." >&2
            exit 1
          fi

      - name: Checkout pinned guide site
        uses: actions/checkout@v4
        with:
          repository: GuinnGreen/AI_ClassMate_guide
          ref: ${{ vars.GUIDE_REF }}
          path: _guide_repo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install main app dependencies
        run: npm ci

      - name: Verify main app
        run: npm run verify

      - name: Verify Firestore Rules
        run: npm run test:rules

      - name: Install and verify Functions
        run: npm ci --prefix functions && npm --prefix functions run verify

      - name: Install and verify Guide
        working-directory: _guide_repo/guide
        run: npm ci && npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main app
        uses: actions/checkout@v4

      - name: Checkout pinned guide site
        uses: actions/checkout@v4
        with:
          repository: GuinnGreen/AI_ClassMate_guide
          ref: ${{ vars.GUIDE_REF }}
          path: _guide_repo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install main app dependencies
        run: npm ci

      - name: Write release manifest
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GUIDE_COMMIT=$(git -C _guide_repo rev-parse HEAD)
          RULES_HASH=$(sha256sum firestore.rules | cut -d' ' -f1)
          APP_COMMIT="$GITHUB_SHA" GUIDE_COMMIT="$GUIDE_COMMIT" RULES_HASH="$RULES_HASH" BUILD_TIME="$BUILD_TIME" npm run release:manifest
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"

      - name: Build main app
        run: npm run build
        env:
          VITE_APP_BUILD_TIME: ${{ env.BUILD_TIME }}
          VITE_APP_ENV: production
          VITE_USE_FIREBASE_EMULATORS: 'false'
          VITE_ALLOW_REMOTE_FIREBASE: 'true'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Install guide dependencies
        working-directory: _guide_repo/guide
        run: npm ci

      - name: Build guide
        working-directory: _guide_repo/guide
        run: npm run build

      - name: Merge build outputs
        run: |
          mkdir -p dist/guide
          cp -r _guide_repo/guide/dist/* dist/guide/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
